<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestionar</title>
  <link rel="stylesheet" href="estilos/estilos.css">
  <script src="scripts/solo-celular.js"></script>
  <link rel="stylesheet" href="estilos/multimedia.css">
</head>
<body class="control compacto">
<div class="app">

  <div class="app-header">
    <div class="header-id">
      <h1>Gestionar</h1>
      <span class="auth-name-badge" id="authNameBadge" hidden></span>
      <button type="button" class="logout-btn" id="logoutBtn" hidden>Cerrar sesión</button>
    </div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Conectando…</span>
    </div>
  </div>

  <nav class="pestanas-gestion" aria-label="Qué gestionar">
    <a href="gestionar.html" aria-current="page">🖼️ Imágenes</a>
    <a href="multimedia.html#musica">🎵 Música</a>
    <a href="multimedia.html#videos">🎬 Videos</a>
  </nav>

  <div class="espacio-caja compacta">
    <div class="espacio-titulo"><span class="espacio-candado" aria-hidden="true">🔒</span><b>Esto es tuyo y de nadie más</b><button type="button" class="boton-info" data-info="limitesImagenes" aria-label="Ver los límites">i</button></div>
    <span class="espacio-usado" id="cuantasImagenes">Cargando tus imágenes…</span>
  </div>

  <div class="tarjetas-subir">
    <button type="button" class="tarjeta-subir principal" id="uploadBtn"><span class="ico" aria-hidden="true">🖼️</span><span><b>Subir fotos</b><small>Hasta 40 a la vez</small></span></button>
    <button type="button" class="tarjeta-subir" id="abrirPaginaBtn" aria-expanded="false" aria-controls="paginaForm"><span class="ico" aria-hidden="true">🌐</span><span><b>Página web</b><small>Pegá un enlace</small></span></button>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>

  <!-- Página web: se pega el enlace y queda en la lista como una diapositiva más -->
  <form class="enlace-compacto" id="paginaForm" hidden>
    <input type="url" class="campo" id="paginaDireccion" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="500" placeholder="Pegá el enlace de la página" aria-label="Enlace de la página web">
    <button type="submit" class="btn primary chico" id="paginaBtn">Agregar</button>
  </form>

  <!-- Elegir varias imágenes para eliminarlas juntas (igual que en Música y videos) -->
  <div class="barra-seleccion barra-elegir" id="barraElegir" hidden>
    <span class="nota-orden">Arrastrá o usá ▲▼ para ordenar</span>
    <button type="button" class="btn chico secondary" id="marcarTodasBtn" hidden>Marcar todas</button>
    <button type="button" class="btn chico" id="elegirBtn">☑️ Seleccionar</button>
  </div>

  <!-- La lista se mueve dentro de su caja: la página queda quieta -->
  <div class="caja-lista">
    <div class="image-list" id="imageList"></div>
    <p class="empty-hint" id="emptyHint" hidden>Todavía no hay imágenes. Tocá «Subir fotos».</p>
  </div>

  <template id="limitesImagenes">
    <b>Límites de imágenes</b>
    <ul>
      <li>Hasta 40 fotos por vez; se suben de a 3.</li>
      <li>JPG, PNG, WEBP o GIF. Se achican solas a 1920 px.</li>
      <li>Sin límite de cantidad: sólo las ves vos.</li>
      <li>Una página web se ve como una diapositiva más. Para manejarla desde el celular, tiene que estar preparada para Conexiones.</li>
    </ul>
  </template>

  <div id="lugarMiniReproductor"></div>

  <!-- Barra fija de abajo mientras se eligen imágenes -->
  <div class="barra-eliminar" id="barraEliminar" hidden>
    <button type="button" class="btn danger-solid" id="eliminarElegidasBtn" disabled>
      <!-- Tacho dibujado (no el emoji) para poder abrirle la tapa al eliminar -->
      <svg class="tacho" viewBox="0 0 26 30" aria-hidden="true">
        <g class="tacho-tapa"><rect x="2" y="5" width="22" height="3.4" rx="1.7"/><rect x="9.5" y="1.6" width="7" height="4" rx="1.6"/></g>
        <g class="tacho-cuerpo"><path d="M4.5 10h17l-1.3 16.2a2.6 2.6 0 0 1-2.6 2.4H8.4a2.6 2.6 0 0 1-2.6-2.4z"/><path class="tacho-rayas" d="M10 13.5v11M13 13.5v11M16 13.5v11"/></g>
      </svg>
      <span id="eliminarTexto">Eliminar</span>
    </button>
    <button type="button" class="btn" id="cancelarElegirBtn">Cancelar</button>
  </div>

  <div class="btn-row">
    <a class="btn" href="control.html">⬅️ Volver</a>
  </div>

</div>

<div class="modal-overlay" id="confirmOverlay" hidden>
  <div class="modal-card">
    <h2>Eliminar imagen</h2>
    <p id="confirmMessage">Esta acción no se puede deshacer.</p>
    <div class="btn-row">
      <button type="button" class="btn" id="confirmCancel">Cancelar</button>
      <button type="button" class="btn danger-solid" id="confirmAccept">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="alert" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="scripts/autenticacion.js"></script>
<script src="scripts/subir-nube.js"></script>
<script src="scripts/subidas-fondo.js"></script>
<script src="scripts/lista-virtual.js"></script>
<script src="scripts/gestionar.js"></script>
<script src="scripts/trabajos-documentos.js"></script>
<script src="scripts/progreso-documentos.js"></script>
<script src="scripts/reproductor-celular.js"></script>

</body>
</html>
