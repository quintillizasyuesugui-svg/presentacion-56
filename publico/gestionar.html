<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestionar</title>
  <link rel="stylesheet" href="estilos/estilos.css">
  <link rel="stylesheet" href="estilos/multimedia.css">
</head>
<body class="control">
<div class="app">

  <div class="app-header">
    <div class="header-id">
      <h1>Gestionar</h1>
      <span class="auth-name-badge" id="authNameBadge" hidden></span>
      <button type="button" class="logout-btn" id="logoutBtn" hidden>Cerrar sesión</button>
    </div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Conectando…</span>
    </div>
  </div>

  <nav class="pestanas-gestion" aria-label="Qué gestionar">
    <a href="gestionar.html" aria-current="page">🖼️ Imágenes</a>
    <a href="multimedia.html#musica">🎵 Música</a>
    <a href="multimedia.html#videos">🎬 Videos</a>
  </nav>

  <div class="panel">
    <div class="btn-row">
      <button class="btn primary" id="uploadBtn">➕ Subir imágenes</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>

    <!-- Página web: se pega el enlace y queda en la lista como una diapositiva más -->
    <form class="caja-pagina" id="paginaForm">
      <label for="paginaDireccion">🌐 Página web</label>
      <div class="caja-pagina-fila">
        <input type="url" id="paginaDireccion" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="500" placeholder="Pegá el enlace de tu página">
        <button type="submit" class="btn" id="paginaBtn">Agregar</button>
      </div>
      <p class="caja-pagina-nota">Se muestra en la pantalla como una diapositiva más. Para manejarla desde el celular, la página tiene que estar preparada para Conexiones.</p>
    </form>

    <!-- Elegir varias imágenes para eliminarlas juntas (igual que en Música y videos) -->
    <div class="barra-seleccion barra-elegir" id="barraElegir" hidden>
      <button type="button" class="btn chico" id="elegirBtn">☑️ Seleccionar</button>
      <button type="button" class="btn chico secondary" id="marcarTodasBtn" hidden>Marcar todas</button>
    </div>

    <div class="image-list" id="imageList"></div>
    <p class="empty-hint" id="emptyHint" hidden>Todavía no hay imágenes. Subí la primera.</p>
  </div>

  <div id="lugarMiniReproductor"></div>

  <!-- Barra fija de abajo mientras se eligen imágenes -->
  <div class="barra-eliminar" id="barraEliminar" hidden>
    <button type="button" class="btn danger-solid" id="eliminarElegidasBtn" disabled>
      <!-- Tacho dibujado (no el emoji) para poder abrirle la tapa al eliminar -->
      <svg class="tacho" viewBox="0 0 26 30" aria-hidden="true">
        <g class="tacho-tapa"><rect x="2" y="5" width="22" height="3.4" rx="1.7"/><rect x="9.5" y="1.6" width="7" height="4" rx="1.6"/></g>
        <g class="tacho-cuerpo"><path d="M4.5 10h17l-1.3 16.2a2.6 2.6 0 0 1-2.6 2.4H8.4a2.6 2.6 0 0 1-2.6-2.4z"/><path class="tacho-rayas" d="M10 13.5v11M13 13.5v11M16 13.5v11"/></g>
      </svg>
      <span id="eliminarTexto">Eliminar</span>
    </button>
    <button type="button" class="btn" id="cancelarElegirBtn">Cancelar</button>
  </div>

  <div class="btn-row">
    <a class="btn" href="control.html">⬅️ Volver</a>
  </div>

</div>

<div class="modal-overlay" id="confirmOverlay" hidden>
  <div class="modal-card">
    <h2>Eliminar imagen</h2>
    <p id="confirmMessage">Esta acción no se puede deshacer.</p>
    <div class="btn-row">
      <button type="button" class="btn" id="confirmCancel">Cancelar</button>
      <button type="button" class="btn danger-solid" id="confirmAccept">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="alert" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="scripts/autenticacion.js"></script>
<script src="scripts/gestionar.js"></script>
<script src="scripts/trabajos-documentos.js"></script>
<script src="scripts/progreso-documentos.js"></script>
<script src="scripts/reproductor-celular.js"></script>

</body>
</html>
