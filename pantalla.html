<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pantalla</title>
  <link rel="stylesheet" href="style.css">
  <!-- Los 18 tipos de letra de "Frase final" — mismas keys/fuentes que en el
       editor de Modo avanzado, para que se vea igual acá y en la vista previa. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@700&family=Bebas+Neue&family=Pacifico&family=Montserrat:wght@700;900&family=Lobster&family=Oswald:wght@600;700&family=Great+Vibes&family=Anton&family=Caveat:wght@700&family=Permanent+Marker&family=Bangers&family=Amatic+SC:wght@700&family=Fredoka:wght@600;700&family=Satisfy&family=Righteous&family=Kalam:wght@700&display=swap" rel="stylesheet">
</head>
<body class="pantalla">

<div class="stage">
  <img id="imgBg" src="" alt="" aria-hidden="true">
  <div class="img-frame" id="imgFrame">
    <img id="img" src="" alt="">
  </div>
</div>

<div class="hud" id="hud">0 / 0</div>
<div class="auto-badge" id="autoBadge" hidden></div>
<div class="identity-corner" id="identityCorner" hidden>
  <div class="identity-pill" id="authBadge"></div>
  <button type="button" class="logout-btn" id="logoutBtn">Cerrar sesión</button>
</div>

<div class="progress-track">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="waiting" id="waiting">
  <canvas class="brain-sphere" id="brainSphere" aria-hidden="true"></canvas>
  <h1>Presentación lista</h1>
  <p id="waitingHint">Presiona el botón para ir a pantalla completa (necesario en algunos navegadores).</p>
  <button id="enterFullscreen" class="btn primary">📺 Ir a pantalla completa</button>
</div>

<div id="fs-indicator" class="fullscreen-indicator">
  <h2>🖥️ Presiona ESC para salir</h2>
</div>

<!-- Frase final: mensaje propio de cada persona, aparece cuando SU show llega
     al final (ver socket 'cambiar' más abajo) o al probarlo desde "Enviar a
     PC" en Modo avanzado (socket 'fraseFinalAhora'). -->
<div id="finalPhrase">
  <div id="finalPhraseText" class="fp-anim-target"></div>
</div>

<!-- Escribir en vivo: lo que la persona dueña de esta pantalla tipea en su
     celular (Control → Escribir en vivo) aparece acá al toque, letra por
     letra — ver socket 'escribirVivoEstado' más abajo. -->
<div id="liveWrite">
  <div id="liveWriteText" class="fp-anim-target"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="auth.js"></script>
<script>
  const socket = io();

  let diapositivas = [];
  let index = 0;
  let started = false; // recién true cuando se recibe "mostrar" o un salto por número

  const img = document.getElementById('img');
  const imgFrame = document.getElementById('imgFrame');
  const imgBg = document.getElementById('imgBg');
  const hud = document.getElementById('hud');
  const autoBadge = document.getElementById('autoBadge');
  const identityCorner = document.getElementById('identityCorner');
  const authBadge = document.getElementById('authBadge');
  const logoutBtn = document.getElementById('logoutBtn');
  const progressFill = document.getElementById('progressFill');
  const waiting = document.getElementById('waiting');
  const waitingHint = document.getElementById('waitingHint');
  const fsIndicator = document.getElementById('fs-indicator');
  const fullscreenButton = document.getElementById('enterFullscreen');
  const finalPhrase = document.getElementById('finalPhrase');
  const finalPhraseText = document.getElementById('finalPhraseText');
  const liveWrite = document.getElementById('liveWrite');
  const liveWriteText = document.getElementById('liveWriteText');

  // ---- Frase final: mensaje propio de cada persona al terminar SU show ----
  // Mismas keys que FRASE_FONTS/FRASE_EFFECTS de server.js y de avanzado.html
  // — server.js valida contra esa misma lista, así que las 3 tienen que
  // coincidir siempre.
  const FRASE_FONT_FAMILIES = {
    sans: "'Poppins', sans-serif",
    serif: "'Playfair Display', serif",
    script: "'Dancing Script', cursive",
    display: "'Bebas Neue', sans-serif",
    casual: "'Pacifico', cursive",
    geometric: "'Montserrat', sans-serif",
    'bold-script': "'Lobster', cursive",
    poster: "'Oswald', sans-serif",
    calligraphy: "'Great Vibes', cursive",
    huge: "'Anton', sans-serif",
    handwritten: "'Caveat', cursive",
    marker: "'Permanent Marker', cursive",
    comic: "'Bangers', cursive",
    'thin-hand': "'Amatic SC', cursive",
    rounded: "'Fredoka', sans-serif",
    'elegant-script': "'Satisfy', cursive",
    strong: "'Righteous', sans-serif",
    notebook: "'Kalam', cursive"
  };

  let fraseFinal = null;      // la propia, guardada — la que cierra el show de verdad
  let showingFinal = false;   // true mientras #finalPhrase está en pantalla
  let finalIsPreview = false; // true si se está mostrando por "Enviar a PC" (no por llegar al final de verdad)

  function refreshFraseFinal() {
    authFetch('/api/frase-final')
      .then(res => res.json())
      .then(frase => { fraseFinal = (frase && frase.text) ? frase : null; })
      .catch(err => console.error('Error loading frase final:', err));
  }

  // Igual que en el editor: máquina de escribir/ola necesitan cada letra en
  // su propio <span> para animarse una por una; los demás efectos animan el
  // bloque de texto entero.
  function renderFinalText(text, effect, duration) {
    finalPhraseText.innerHTML = '';
    if (effect === 'typewriter' || effect === 'wave') {
      const baseStep = effect === 'typewriter' ? 45 : 60;
      const stepMs = baseStep * duration;
      [...text].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'fp-letter';
        span.textContent = ch === ' ' ? ' ' : ch;
        span.style.animationDelay = (i * stepMs) + 'ms';
        finalPhraseText.appendChild(span);
      });
    } else {
      finalPhraseText.textContent = text;
    }
  }

  function showFinalPhrase(frase, { preview } = {}) {
    finalIsPreview = !!preview;
    showingFinal = true;
    const duration = frase.duration || 1;
    finalPhraseText.style.fontFamily = FRASE_FONT_FAMILIES[frase.font] || FRASE_FONT_FAMILIES.sans;
    finalPhraseText.style.color = frase.color || '#ffffff';
    renderFinalText(frase.text, frase.effect, duration);

    finalPhrase.style.setProperty('--fp-duration', (duration * 1000) + 'ms');
    finalPhrase.style.setProperty('--fp-size-scale', frase.fontSize || 1);
    finalPhrase.className = 'fp-pos-' + (frase.position || 'middle');
    void finalPhrase.offsetWidth; // fuerza reflow para poder repetir la animación
    finalPhrase.classList.add('show', 'fp-' + frase.effect);

    if (frase.effect === 'confetti') confetti();
  }

  function hideFinalPhrase() {
    showingFinal = false;
    finalIsPreview = false;
    finalPhrase.classList.remove('show');
  }

  // ---- Escribir en vivo: texto propio, tipeado ahora mismo desde el celular ----
  // Mismo mapa de fuentes que "Frase final" — server.js valida contra la misma
  // lista cerrada, así las keys siempre coinciden acá y en control.html.
  let liveWriteActive = false; // true mientras #liveWrite está en pantalla
  let liveWriteEffect = null;  // efecto que se está reproduciendo ahora, para
                                // no repetir la animación de entrada en cada letra
  let liveWriteScale = 1;

  // Encoge el texto si no entra (varios versos largos) hasta que quepa, sin
  // pasar de un tamaño ilegible — se recalcula en cada letra que se escribe.
  function fitLiveWriteText() {
    let scale = liveWriteScale;
    liveWriteText.style.setProperty('--fp-size-scale', scale);
    let intentos = 0;
    while (
      intentos++ < 40 && scale > 0.2 &&
      (liveWriteText.scrollHeight > liveWrite.clientHeight - 48 ||
       liveWriteText.scrollWidth > liveWrite.clientWidth - 48)
    ) {
      scale -= 0.04;
      liveWriteText.style.setProperty('--fp-size-scale', scale);
    }
  }

  function aplicarEscribirVivo(estado) {
    if (!estado) return;
    if (!estado.active) {
      liveWrite.classList.remove('show');
      liveWriteActive = false;
      liveWriteEffect = null;
      return;
    }

    liveWriteText.style.fontFamily = FRASE_FONT_FAMILIES[estado.font] || FRASE_FONT_FAMILIES.sans;
    liveWriteText.style.color = estado.color || '#ffffff';
    liveWriteScale = estado.fontSize || 1;
    liveWriteText.textContent = estado.text || '';

    // La animación de entrada sólo se reproduce al prenderse o al cambiar de
    // efecto — así no se reinicia con cada letra que se tipea, que se vería
    // entrecortado en vez de fluido.
    if (!liveWriteActive || estado.effect !== liveWriteEffect) {
      liveWrite.className = '';
      void liveWrite.offsetWidth; // fuerza reflow para poder repetir la animación
      liveWrite.classList.add('show', 'fp-' + estado.effect);
      liveWriteEffect = estado.effect;
      liveWriteActive = true;
    }
    fitLiveWriteText();
  }

  // ---- Avance automático: opcional, 100% local a esta pantalla ----
  // No manda nada por socket — sólo llama a aplicarCambio('siguiente') acá
  // mismo, así que no le afecta a nadie más ni a ningún otro dispositivo.
  let autoAdvance = null; // { enabled, seconds }
  let autoAdvanceTimer = null;
  let autoAdvanceEndAt = null; // Date.now() del próximo salto — sólo para pintar la cuenta regresiva

  function refreshAutoAdvance() {
    authFetch('/api/avance-automatico')
      .then(res => res.json())
      .then(auto => {
        autoAdvance = auto;
        // Si el show ya arrancó y no hay ningún reloj corriendo todavía —
        // por ejemplo, se apretó "Mostrar" antes de que este pedido
        // terminara, o recién ahora se prendió desde otro dispositivo —
        // lo arranca acá. Si YA hay uno corriendo, no lo toca (eso es lo
        // que hace que sobreviva a este mismo refresco cada 4s).
        if (started && !autoAdvanceTimer) scheduleAutoAdvance();
      })
      .catch(err => console.error('Error loading avance automático:', err));
  }

  function formatCountdown(totalSeconds) {
    if (totalSeconds >= 60) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return m + 'm ' + String(s).padStart(2, '0') + 's';
    }
    return totalSeconds + 's';
  }

  // Corre siempre, una vez por segundo — sólo pinta algo si hay una cuenta
  // regresiva activa (autoAdvanceEndAt). No decide nada por su cuenta: el
  // salto de verdad lo hace el setTimeout de scheduleAutoAdvance().
  function updateAutoBadge() {
    if (!autoAdvanceEndAt) { autoBadge.hidden = true; return; }
    const remaining = Math.max(0, Math.ceil((autoAdvanceEndAt - Date.now()) / 1000));
    autoBadge.hidden = false;
    autoBadge.textContent = '⏱️ Siguiente en ' + formatCountdown(remaining);
  }
  setInterval(updateAutoBadge, 1000);

  // Se reprograma después de CUALQUIER cambio de diapositiva (manual o
  // automático) — así el reloj arranca de nuevo cada vez, en vez de sumarse
  // al que ya venía corriendo. El refresco silencioso de cada 4s (arriba)
  // sólo actualiza el DATO guardado — nunca llama a esta función — así que
  // la cuenta regresiva no se reinicia ni se corta por esas actualizaciones.
  function scheduleAutoAdvance() {
    if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    autoAdvanceEndAt = null;
    if (!started || !autoAdvance || !autoAdvance.enabled) { updateAutoBadge(); return; }
    autoAdvanceEndAt = Date.now() + autoAdvance.seconds * 1000;
    updateAutoBadge();
    // Le avisa al control (celular) para que arranque el mismo contador en
    // vivo, al mismo instante — así los dos relojes quedan sincronizados.
    socket.emit('avanceAutoAviso', { tipo: 'cuenta', segundos: autoAdvance.seconds });
    autoAdvanceTimer = setTimeout(() => {
      aplicarCambio('siguiente', { auto: true });
    }, autoAdvance.seconds * 1000);
  }

  // ---- Red neuronal esférica 3D (pantalla de espera) ----
  // Los nodos viven en coordenadas (x,y,z) reales sobre una esfera y se rotan
  // con matemática 3D de verdad cada cuadro; se proyectan a 2D con perspectiva
  // (más cerca de "cámara" = más grande y brillante) y se dibujan de atrás
  // hacia adelante para que se tapen entre sí de forma correcta.
  function initBrainSphere() {
    const canvas = document.getElementById('brainSphere');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const SIZE = 200; // tamaño lógico en px — el CSS puede achicarlo, la nitidez la da el dpr
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = SIZE * dpr;
    canvas.height = SIZE * dpr;
    ctx.scale(dpr, dpr);

    const COUNT = 68; // más "neuronas" — red más densa
    const AXIAL_TILT = -0.4; // inclinación fija del eje, look "planeta"
    const nodes = [];

    // Distribución pareja de puntos sobre una esfera unitaria (esfera de Fibonacci)
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < COUNT; i++) {
      const y = 1 - (i / (COUNT - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = goldenAngle * i;
      nodes.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, activity: 0 });
    }

    function dist3(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
    }

    // Cada nodo se conecta con sus 3 vecinos más cercanos en el espacio 3D — malla más rica
    const edges = [];
    nodes.forEach((n, i) => {
      const nearest = nodes
        .map((m, j) => ({ j, d: i === j ? Infinity : dist3(n, m) }))
        .sort((a, b) => a.d - b.d)
        .slice(0, 3);
      nearest.forEach(({ j }) => {
        const key = [i, j].sort((a, b) => a - b).join('-');
        if (!edges.some(e => e.key === key)) edges.push({ key, a: i, b: j });
      });
    });

    // "Pensamiento": pulsos de señal que viajan entre nodos conectados y hacen
    // destellar al nodo que los recibe — como sinapsis disparando al azar.
    const pulses = [];
    let nextPulseAt = 0;

    function spawnPulse(now) {
      const edge = edges[Math.floor(Math.random() * edges.length)];
      const forward = Math.random() < 0.5;
      pulses.push({
        from: forward ? edge.a : edge.b,
        to: forward ? edge.b : edge.a,
        start: now,
        duration: 450 + Math.random() * 350
      });
      nextPulseAt = now + 30 + Math.random() * 90; // más seguido = se ve "pensando" más rápido
    }

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const R = SIZE * 0.36;
    const CX = SIZE / 2;
    const CY = SIZE / 2;
    const PERSPECTIVE = 2.5;

    function render(now, animated) {
      const angle = animated ? (now / 1000) * 0.35 : 0.6;
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      const cosT = Math.cos(AXIAL_TILT), sinT = Math.sin(AXIAL_TILT);

      // Rota en Y (giro del "planeta") y aplica una inclinación fija en X
      const rotated = nodes.map(n => {
        const x = n.x * cosA - n.z * sinA;
        const zSpin = n.x * sinA + n.z * cosA;
        const y = n.y * cosT - zSpin * sinT;
        const z = n.y * sinT + zSpin * cosT;
        return { x, y, z };
      });

      const screen = rotated.map(p => {
        const scale = PERSPECTIVE / (PERSPECTIVE - p.z);
        return { x: CX + p.x * R * scale, y: CY + p.y * R * scale, z: p.z, scale };
      });

      if (animated) {
        // Dispara pulsos de señal al azar entre nodos conectados
        if (now >= nextPulseAt) spawnPulse(now);

        for (let i = pulses.length - 1; i >= 0; i--) {
          const pulse = pulses[i];
          const t = (now - pulse.start) / pulse.duration;
          if (t >= 1) {
            nodes[pulse.to].activity = 1; // el nodo receptor "se enciende"
            pulses.splice(i, 1);
          }
        }
        nodes.forEach(n => { n.activity *= 0.9; }); // decae hasta el próximo pulso
      }

      ctx.clearRect(0, 0, SIZE, SIZE);

      // Silueta de la esfera, apenas visible
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(23, 182, 234, 0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Conexiones — más tenues cuanto más lejos de "cámara"
      edges.forEach(e => {
        const a = screen[e.a], b = screen[e.b];
        const depth = ((a.z + b.z) / 2 + 1) / 2; // 0 = atrás, 1 = adelante
        ctx.beginPath();
        ctx.strokeStyle = `rgba(52, 205, 250, ${0.06 + depth * 0.35})`;
        ctx.lineWidth = 1;
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      });

      // Nodos, dibujados de atrás hacia adelante para que se superpongan bien
      const order = screen.map((_, i) => i).sort((i, j) => screen[i].z - screen[j].z);
      order.forEach(i => {
        const p = screen[i];
        const activity = nodes[i].activity;
        const depth = (p.z + 1) / 2;
        const radius = Math.max(0.9, 2.6 * p.scale) * (1 + activity * 0.7);
        const opacity = Math.min(1, 0.35 + depth * 0.65 + activity * 0.5);
        const grad = ctx.createRadialGradient(p.x - radius * 0.3, p.y - radius * 0.3, 0, p.x, p.y, radius);
        grad.addColorStop(0, `rgba(201, 247, 255, ${opacity})`);
        grad.addColorStop(1, `rgba(23, 182, 234, ${opacity * 0.85})`);
        ctx.beginPath();
        ctx.fillStyle = grad;
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Pulsos viajando por sus conexiones — el "pensamiento" en tránsito
      if (animated) {
        pulses.forEach(pulse => {
          const t = Math.min(1, (now - pulse.start) / pulse.duration);
          const a = screen[pulse.from], b = screen[pulse.to];
          const x = a.x + (b.x - a.x) * t;
          const y = a.y + (b.y - a.y) * t;
          ctx.beginPath();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.arc(x, y, 1.8, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    if (reduceMotion) {
      render(0, false); // ángulo fijo, sin loop de animación
      return;
    }

    function loop(ts) {
      if (waiting.classList.contains('hide')) return; // se detiene solo al arrancar la presentación
      render(ts, true);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
  initBrainSphere();

  // Cada pantalla muestra sólo lo suyo: con el PIN de una persona ve nomás
  // sus propias fotos; con el PIN admin ve el show combinado de todos (para
  // el proyector/TV principal). /api/images ya viene filtrado por dueño.
  function refreshSlides() {
    authFetch('/api/images')
      .then(res => res.json())
      .then(images => {
        diapositivas = images;
        // Si se borraron imágenes y el índice actual quedó fuera de rango, lo acotamos
        if (index > diapositivas.length - 1) index = Math.max(0, diapositivas.length - 1);
        updateHud();
        updateProgress();
      })
      .catch(err => console.error('Error loading images:', err));
  }

  // Acá no se da de alta gente nueva — eso se hace desde el celular
  // (control.html/manage.html). Esta pantalla sólo pide el PIN ya asignado.
  ensureAuthed({ allowRegister: false }).then((auth) => {
    identityCorner.hidden = false;
    authBadge.textContent = authBadgeText(auth, { showPin: false });
    logoutBtn.addEventListener('click', () => logoutAuth());
    refreshSlides();
    refreshFraseFinal();
    refreshAutoAdvance();
    socket.on('imagenesActualizadas', refreshSlides);
    // Respaldo silencioso: si el socket no avisa (reconexión, proxy, etc.),
    // igual nos enteramos de imágenes nuevas/borradas sin tocar lo que ya
    // se está mostrando — refreshSlides() sólo actualiza la lista y el HUD,
    // nunca el índice actual ni la imagen en pantalla. De paso, si alguien
    // edita su frase final o su avance automático desde otro dispositivo,
    // esta pantalla lo toma solo — pero refreshAutoAdvance() sólo actualiza
    // el dato guardado, nunca reinicia la cuenta regresiva que ya está
    // corriendo (eso sólo lo hace scheduleAutoAdvance(), al cambiar de
    // diapositiva de verdad).
    setInterval(() => { refreshSlides(); refreshFraseFinal(); refreshAutoAdvance(); }, 4000);

    // Vincula este socket a la sala de este dueño (por PIN) para que "Enviar
    // a PC" (Modo avanzado) le pueda mandar la frase sólo a esta pantalla, no
    // a las de otras personas. Se repite en cada reconexión — la sala es por
    // conexión de socket, no por dispositivo.
    function identificarSocket() { socket.emit('identificar', auth.pin); }
    identificarSocket();
    socket.on('connect', identificarSocket);

    // "Enviar a PC" desde el editor — la muestra ya mismo, sin esperar a que
    // el show llegue al final de verdad. Al apretar "Siguiente" después, esta
    // pantalla vuelve a lo que estaba mostrando antes (no arranca de nuevo).
    socket.on('fraseFinalAhora', (frase) => {
      if (!frase || !frase.text) return;
      showFinalPhrase(frase, { preview: true });
    });

    // "Escribir en vivo" desde el celular — mismo mecanismo de sala que la de
    // arriba, así sólo le llega a esta pantalla y nunca a la de otra persona.
    socket.on('escribirVivoEstado', aplicarEscribirVivo);
  });

  function updateHud() {
    // "index" arranca en 0 (la primera diapositiva) pero a la gente se le
    // muestra el show empezando en 1 — antes de arrancar (waiting) se queda
    // en 0, igual que el criterio que ya usaba updateProgress() para la barra.
    hud.textContent = (started ? index + 1 : 0) + ' / ' + diapositivas.length;
  }

  function updateProgress() {
    const progress = (started && diapositivas.length) ? (index + 1) / diapositivas.length : 0;
    progressFill.style.transform = `scaleX(${progress})`;
  }

  function requestFullscreenNow() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  }

  fullscreenButton.addEventListener('click', () => {
    requestFullscreenNow();
    waitingHint.textContent = 'Pantalla completa activada';
  });

  document.addEventListener('fullscreenchange', () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
    document.body.classList.toggle('cinema-mode', !!isFs);
    if (!isFs) {
      waitingHint.textContent = 'Presiona el botón para ir a pantalla completa';
    }
  });

  socket.on('cine', () => {
    requestFullscreenNow();
    fsIndicator.classList.add('show');
    setTimeout(() => fsIndicator.classList.remove('show'), 2000);
  });

  // "aplicarCambio" es la única función que mueve diapositivas — la llama
  // tanto el socket (control remoto compartido) como el temporizador local
  // de avance automático (con opts.auto = true). Así ambos caminos comparten
  // toda la lógica de la frase final, el confetti, etc. sin duplicar nada.
  function aplicarCambio(accion, opts = {}) {
    const fromAuto = !!opts.auto;
    // Avance automático prendido: los botones manuales de Siguiente/Atrás no
    // hacen nada en ESTA pantalla (el reloj es el que manda) — "Mostrar" y el
    // salto por número de voz siguen funcionando igual.
    if (!fromAuto && autoAdvance && autoAdvance.enabled && (accion === 'siguiente' || accion === 'anterior')) {
      return;
    }
    // Mientras "Escribir en vivo" está mostrándose, ningún comando de
    // navegación hace nada (ni por botón, ni por voz, ni desde otro
    // dispositivo) hasta que se apague — Mostrar/Siguiente/Atrás quedan
    // congelados abajo, tapados por el texto a pantalla completa.
    if (liveWriteActive && (accion === 'mostrar' || accion === 'siguiente' || accion === 'anterior')) {
      return;
    }

    if (accion === 'mostrar') {
      if (showingFinal) hideFinalPhrase();
      index = 0;
      started = true;
      waiting.classList.add('hide');
      identityCorner.hidden = true; // deja de taparle una esquina a las fotos
    } else if (accion === 'siguiente') {
      if (showingFinal) {
        // Si era sólo una prueba ("Enviar a PC"), no tocó el índice — al
        // cerrarla, lo de abajo ya es la diapositiva correcta, no hay que
        // re-renderizar nada. Si en cambio era la frase final de verdad
        // (se llegó al final del show), "Siguiente" arranca de nuevo desde 1.
        const wasPreview = finalIsPreview;
        hideFinalPhrase();
        if (wasPreview) { scheduleAutoAdvance(); return; }
        index = 0;
      } else if (diapositivas.length && index >= diapositivas.length - 1 && fraseFinal) {
        // Última diapositiva + hay una frase final propia configurada: en vez
        // de volver a la 1, se muestra el cierre.
        showFinalPhrase(fraseFinal);
        updateHud();
        updateProgress();
        // Si fue el avance automático el que llegó hasta acá, termina el show
        // solo — se desactiva (y avisa al servidor, para que no vuelva a
        // prenderse solo si se recarga la página) en vez de seguir en loop.
        if (fromAuto && autoAdvance && autoAdvance.enabled) {
          autoAdvance.enabled = false;
          scheduleAutoAdvance();
          authFetch('/api/avance-automatico', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: false, seconds: autoAdvance.seconds })
          }).catch(err => console.error('No se pudo desactivar el avance automático:', err));
          socket.emit('avanceAutoAviso', { tipo: 'terminamos' });
        }
        return; // no tocar #img/#imgBg mientras se muestra la frase
      } else {
        index++;
        if (index >= diapositivas.length) index = 0;
      }
    } else if (accion === 'anterior') {
      if (showingFinal) {
        // Volvemos a lo que ya estaba debajo (última diapositiva o la que se
        // veía antes de la prueba) — no hace falta tocar #img para nada.
        hideFinalPhrase();
        scheduleAutoAdvance();
        return;
      }
      index--;
      if (index < 0) index = diapositivas.length - 1;
    } else if (/^[0-9]+$/.test(accion)) {
      // Salto directo por número de voz (ej. "3") — 1-indexado desde el control
      const n = parseInt(accion, 10);
      if (n < 1 || n > diapositivas.length) return;
      if (showingFinal) hideFinalPhrase();
      index = n - 1;
      started = true;
      waiting.classList.add('hide');
      identityCorner.hidden = true;
    } else {
      return;
    }

    updateHud();
    updateProgress();

    img.classList.remove('show');
    imgBg.classList.remove('show');
    img.onload = () => {
      img.classList.add('show');
      imgBg.classList.add('show');
      if (index === diapositivas.length - 1) confetti();
    };
    const slide = diapositivas[index];
    img.src = slide.src;
    imgBg.src = slide.src;
    // Ajuste de tamaño/posición del Modo avanzado (celular) — sin transición
    // propia: el crossfade de #img ya tapa el salto al cambiar de diapositiva.
    imgFrame.style.transform = slide.transform
      ? `translate(${slide.transform.x}%, ${slide.transform.y}%) scale(${slide.transform.scale})`
      : 'none';

    scheduleAutoAdvance();
  }

  socket.on('cambiar', (accion) => aplicarCambio(accion));

  function confetti() {
    const canvas = document.createElement('canvas');
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '10000';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const pieces = [];
    const colors = ['#34cdfa', '#ffcb4d', '#ff6b6b', '#e9eef2', '#97ecff'];
    for (let i = 0; i < 150; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        vx: Math.random() * 10 - 5,
        vy: Math.random() * 3 + 2,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        vr: Math.random() * 10 - 5
      });
    }
    let animationId;
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        p.rotation += p.vr;
        if (p.y > canvas.height) {
          p.y = -p.size;
          p.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      animationId = requestAnimationFrame(animate);
    }
    animate();
    setTimeout(() => {
      cancelAnimationFrame(animationId);
      document.body.removeChild(canvas);
    }, 3000);
  }

  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' || event.key === 'Esc') {
      if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
  });
</script>
